<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axial — Character Generator</title>
  <meta name="description" content="Build an Axial character with lifepaths, starting gear, powers and bonds. Download a Word sheet or print to PDF." />
  <link rel="stylesheet" href="power-picker.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      --bg: #050810;
      --surface: rgba(13, 20, 38, 0.72);
      --surface-strong: rgba(13, 20, 38, 0.95);
      --border: rgba(0, 255, 204, 0.22);
      --border-bright: rgba(0, 255, 204, 0.55);
      --text: #d7e4e0;
      --text-dim: #8fa3a0;
      --accent: #00ffcc;
      --accent-hover: #00cc99;
      --accent-alt: #ff4fd8;
      --glow: rgba(0, 255, 204, 0.35);
      --glow-soft: rgba(0, 255, 204, 0.12);
      --danger: #ff6b6b;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .bg-aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 15% 10%, rgba(0, 255, 204, 0.07), transparent 60%),
        radial-gradient(ellipse 50% 40% at 85% 25%, rgba(255, 79, 216, 0.06), transparent 60%),
        radial-gradient(ellipse 70% 50% at 50% 100%, rgba(0, 120, 255, 0.06), transparent 65%);
    }

    h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }
    ::selection { background: var(--accent); color: #02110d; }

    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 6px; }

    /* ===== NAV ===== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 13px 24px;
      background: rgba(5, 8, 16, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .nav-brand {
      font-family: 'Press Start 2P', monospace;
      font-size: .72em;
      color: var(--accent);
      text-shadow: 0 0 14px var(--glow);
    }

    .nav-links { display: flex; gap: 6px; flex-wrap: wrap; }

    .nav-btn {
      font-family: 'Space Grotesk', sans-serif;
      font-size: .82em;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--text);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 7px 12px;
      cursor: pointer;
      transition: all .25s ease;
    }

    .nav-btn:hover { color: var(--accent); border-color: var(--border); background: var(--glow-soft); }

    /* ===== LAYOUT ===== */
    .page {
      position: relative;
      z-index: 2;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 80px;
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 26px;
      align-items: start;
    }

    .page > * { min-width: 0; }

    @media (max-width: 980px) {
      .page { grid-template-columns: 1fr; }
      .sidebar { position: static !important; }
    }

    /* ===== STEPPER ===== */
    .stepper {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
    }

    .step-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: .8em;
      font-weight: 600;
      letter-spacing: .03em;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-dim);
      cursor: pointer;
      transition: all .25s ease;
      user-select: none;
    }

    .step-pill .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid var(--border);
      font-size: .85em;
    }

    .step-pill:hover { border-color: var(--border-bright); color: var(--text); }

    .step-pill.active {
      color: #02110d;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 18px var(--glow);
    }

    .step-pill.active .num { border-color: #02110d; }

    .step-pill.done { color: var(--accent); }
    .step-pill.done .num { background: var(--glow-soft); border-color: var(--border-bright); }

    /* ===== CARDS ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      margin-bottom: 20px;
    }

    .card h2 {
      color: var(--accent);
      font-size: 1.25em;
      margin-bottom: 4px;
    }

    .card h3 { font-size: 1em; color: var(--accent); margin: 18px 0 8px; }

    .rules-note {
      font-size: .86em;
      color: var(--text-dim);
      line-height: 1.55;
      margin-bottom: 16px;
    }

    .rules-note b { color: var(--text); }

    /* ===== FORM BITS ===== */
    label.field { display: block; font-size: .82em; font-weight: 600; color: var(--text-dim); margin: 12px 0 5px; letter-spacing: .04em; text-transform: uppercase; }

    input[type=text], textarea, select {
      width: 100%;
      background: rgba(2, 6, 14, 0.6);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: .95em;
      padding: 10px 12px;
      transition: border-color .2s;
    }

    input[type=text]:focus, textarea:focus, select:focus { outline: none; border-color: var(--border-bright); }
    textarea { resize: vertical; min-height: 64px; }
    select { cursor: pointer; }
    select option { background: #0a1020; }

    /* ===== OPTION GRID (birth traits / lifepaths) ===== */
    .option-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 12px;
    }

    .opt {
      text-align: left;
      font: inherit;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(2, 6, 14, 0.45);
      padding: 14px;
      cursor: pointer;
      transition: all .22s ease;
    }

    .opt:hover { border-color: var(--border-bright); transform: translateY(-2px); }

    .opt.selected {
      border-color: var(--accent);
      background: var(--glow-soft);
      box-shadow: 0 0 18px var(--glow-soft);
    }

    .opt .opt-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1em; color: var(--text); margin-bottom: 5px; }
    .opt.selected .opt-name { color: var(--accent); }
    .opt .opt-stats { font-size: .78em; color: var(--accent-alt); font-weight: 500; line-height: 1.5; margin-bottom: 6px; }
    .opt .opt-desc { font-size: .8em; color: var(--text-dim); line-height: 1.45; }

    /* ===== BUTTONS ===== */
    .btn {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: .9em;
      letter-spacing: .03em;
      padding: 11px 20px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: all .22s ease;
    }

    .btn:hover { border-color: var(--border-bright); color: var(--accent); transform: translateY(-1px); }

    .btn.glow {
      background: var(--accent);
      border-color: var(--accent);
      color: #02110d;
      box-shadow: 0 0 18px var(--glow);
    }

    .btn.glow:hover { background: var(--accent-hover); color: #02110d; }
    .btn.danger { color: var(--danger); border-color: rgba(255, 107, 107, 0.4); }
    .btn.danger:hover { border-color: var(--danger); }
    .btn.small { padding: 6px 12px; font-size: .8em; border-radius: 8px; }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .step-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
    }

    /* ===== TP ALLOCATION ===== */
    .pool-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }

    .pool-chip {
      font-size: .8em;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(2, 6, 14, 0.5);
      color: var(--text-dim);
      cursor: pointer;
      transition: all .2s ease;
      user-select: none;
    }

    .pool-chip:hover { border-color: var(--border-bright); color: var(--text); }
    .pool-chip.active { border-color: var(--accent); color: var(--accent); background: var(--glow-soft); }
    .pool-chip.empty { opacity: .45; }
    .pool-chip .left { color: var(--accent-alt); }

    .talent-cat { margin-bottom: 12px; }
    .talent-cat-name { font-size: .78em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-alt); margin-bottom: 7px; }

    .talent-grid { display: flex; flex-wrap: wrap; gap: 7px; }

    .talent-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: .8em;
      padding: 5px 8px 5px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(2, 6, 14, 0.5);
      transition: all .15s ease;
    }

    .talent-tag.has-level { border-color: var(--border-bright); background: var(--glow-soft); }
    .talent-tag .lvl { font-weight: 700; color: var(--accent); font-size: .9em; min-width: 26px; text-align: center; }
    .talent-tag button {
      width: 21px; height: 21px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--accent);
      font-weight: 700;
      cursor: pointer;
      font-size: .95em;
      line-height: 1;
      transition: all .15s ease;
    }
    .talent-tag button:hover { background: var(--glow-soft); border-color: var(--border-bright); }
    .talent-tag button:disabled { opacity: .25; cursor: not-allowed; }

    .custom-talent-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .custom-talent-row input { flex: 1 1 160px; }
    .custom-talent-row select { flex: 0 1 150px; width: auto; }

    /* ===== MAIN LIFEPATH INSTANCES ===== */
    .lp-instance {
      border: 1px solid var(--border-bright);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      background: rgba(2, 6, 14, 0.4);
    }

    .lp-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .lp-head h4 { color: var(--accent); font-size: 1.02em; }
    .lp-roll { font-size: .82em; color: var(--accent-alt); font-weight: 600; }
    .lp-roll .dice { font-family: 'Space Grotesk', sans-serif; }

    .choice-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .choice-pill {
      font-size: .8em; font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      cursor: pointer;
      color: var(--text-dim);
      transition: all .2s ease;
    }
    .choice-pill:hover { border-color: var(--border-bright); color: var(--text); }
    .choice-pill.selected { border-color: var(--accent); color: var(--accent); background: var(--glow-soft); }

    .power-desc { font-size: .8em; color: var(--text-dim); line-height: 1.5; margin-top: 6px; border-left: 2px solid var(--border-bright); padding-left: 10px; }

    /* ===== BONDS ===== */
    .bond-row {
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 13px;
      margin-bottom: 11px;
      background: rgba(2, 6, 14, 0.4);
    }
    .bond-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .bond-controls select { flex: 1 1 140px; width: auto; font-size: .85em; }
    .bond-row textarea { min-height: 48px; font-size: .9em; }

    /* ===== SIDEBAR ===== */
    .sidebar {
      position: sticky;
      top: 76px;
    }

    .sidebar .card { padding: 18px; }
    .sidebar h3 { margin: 0 0 10px; font-size: .95em; }

    .stat-line { display: flex; justify-content: space-between; font-size: .84em; padding: 4px 0; border-bottom: 1px dashed rgba(0, 255, 204, 0.12); }
    .stat-line .v { color: var(--accent); font-weight: 600; }
    .stat-line .v.neg { color: var(--danger); }

    .skill-bars { margin-top: 6px; }
    .skill-row { display: grid; grid-template-columns: 78px 1fr 38px; align-items: center; gap: 8px; font-size: .78em; padding: 2.5px 0; }
    .skill-row .die { color: var(--accent); font-weight: 700; text-align: right; }
    .skill-meter { height: 7px; border-radius: 4px; background: rgba(0, 255, 204, 0.08); overflow: hidden; }
    .skill-meter span { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent-hover), var(--accent)); transition: width .3s ease; }

    .side-talents { font-size: .78em; line-height: 1.55; color: var(--text-dim); }
    .side-talents b { color: var(--text); font-weight: 600; }

    .warn { font-size: .78em; color: #ffcf6b; margin-top: 8px; line-height: 1.4; }

    /* ===== SUMMARY ===== */
    .summary-sheet { background: var(--surface-strong); }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 26px; }
    @media (max-width: 700px) { .summary-grid { grid-template-columns: 1fr; } }

    .sum-block { margin-bottom: 16px; }
    .sum-block h3 { margin-top: 0; }
    .sum-line { font-size: .88em; padding: 3px 0; border-bottom: 1px dashed rgba(0, 255, 204, 0.12); display: flex; justify-content: space-between; gap: 10px; }
    .sum-line .v { color: var(--accent); font-weight: 600; }
    .opt .opt-name, .opt .opt-stats, .opt .opt-desc { display: block; }
    .choice-pill { background: var(--surface); font-family: inherit; }
    .kit-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
    .gear-list { list-style: none; padding: 0; margin: 12px 0; }
    .gear-list li { border-bottom: 1px solid var(--border); padding: 8px 0; }
    .gear-list li small { display: block; color: var(--text-dim); margin-top: 3px; overflow-wrap: anywhere; }
    .export-actions { display: flex; flex-wrap: wrap; gap: 9px; margin: 18px 0; }
    .sum-text, .opt, .summary-sheet, .side-talents { overflow-wrap: anywhere; }
    .sum-text.multiline { white-space: pre-wrap; }
    .card :focus-visible, .stepper :focus-visible { outline: 2px solid var(--accent-alt); outline-offset: 3px; }
    .sum-text { font-size: .88em; line-height: 1.55; color: var(--text); }
    .sum-text em { color: var(--text-dim); }

    .gm-note {
      border: 1px dashed var(--border-bright);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: .84em;
      color: var(--text-dim);
      line-height: 1.5;
      margin-top: 14px;
    }

    /* ===== PRINT ===== */
    @media print {
      body { background: #fff; color: #000; }
      .navbar, .stepper, .sidebar, .step-actions, .bg-aurora, .no-print { display: none !important; }
      .page { display: block; padding: 0; max-width: 100%; }
      .card { background: #fff; border: 1px solid #999; color: #000; backdrop-filter: none; box-shadow: none; }
      .card h2, .card h3, .sum-line .v, a { color: #000; }
      .sum-text, .sum-text em, .gm-note, .rules-note { color: #222; }
      .opt .opt-stats { color: #444; }
    }
  </style>
</head>

<body>
  <div class="bg-aurora"></div>

  <nav class="navbar">
    <div class="nav-brand">AXIAL // CHARACTER GENERATOR</div>
    <div class="nav-links">
      <a href="index.html" class="nav-btn">← Axial Hub</a>
      <a href="geargen.html" class="nav-btn">Gear Forge</a>
      <a href="systemgen.html" class="nav-btn">System Survey</a>
      <a href="https://docs.google.com/document/d/1FDHUbisK-Rg0hwTEnfX1re6PS7ADPhH-DNK_3v_LgIE/edit?usp=sharing" target="_blank" rel="noopener" class="nav-btn">Rulebook</a>
      <button class="nav-btn" onclick="resetAll()">Start Over</button>
    </div>
  </nav>

  <div class="page">

    <!-- Stepper -->
    <div class="stepper" id="stepper"></div>

    <!-- Main column -->
    <main id="main"></main>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>
  </div>

  <script src="character-data.js"></script>
  <script src="powerdata.js"></script>
  <script src="power-picker.js"></script>
  <script src="character-export.js"></script>
  <script>
    'use strict';

    // ==========================================================
    // GAME DATA — transcribed from the Axial rulebook (alpha)
    // ==========================================================
    const SKILLS = ['Agility', 'Artifice', 'Charm', 'Fortitude', 'Intellect', 'Might', 'Presence', 'Precision', 'Resolve', 'Sense'];
    const DIE_OF = { 1: 'd4', 2: 'd6', 3: 'd8', 4: 'd10', 5: 'd12' };
    const DIE_SIZE = { 1: 4, 2: 6, 3: 8, 4: 10, 5: 12 };
    const CATS = ['Knowledge', 'Combat', 'Practical', 'Athletics', 'Social'];

    const TALENTS = AxialCharacterRules.talents;

    const BIRTH_TRAITS = {
      Hale: { skills: { Might: 1, Agility: 1 }, desc: 'You were born a bit stronger than the average person.' },
      Thoughtful: { skills: { Intellect: 1, Artifice: 1 }, desc: 'You were born rather pensive.' },
      Keen: { skills: { Sense: 1, Precision: 1 }, desc: 'You were born always deeply concentrated.' },
      Tough: { skills: { Fortitude: 1, Resolve: 1 }, desc: 'You were born ready for punishment.' },
      Social: { skills: { Charm: 1, Presence: 1 }, desc: 'You were born chatty and forceful.' }
    };

    // TP pools: { n, cats: [...] } — points in multi-category pools may be split freely
    const EARLY_LIFEPATHS = {
      Dire: {
        skills: { Might: 1, Fortitude: 1, Agility: 1, Resolve: 1, Sense: 1 },
        supplies: 8, wealth: 1,
        pools: [
          { n: 5, cats: ['Practical'] },
          { n: 4, cats: ['Athletics'] },
          { n: 4, cats: ['Combat'] },
          { n: 2, cats: ['Social', 'Knowledge'] }
        ],
        desc: 'Whether you had to fight for your survival or you simply had a hard and punishing life, it taught you strength in many practical and physical ways.'
      },
      Tough: {
        skills: { Might: 1, Fortitude: 1, Artifice: 1, Resolve: 1, Precision: 1 },
        supplies: 6, wealth: 2,
        pools: [
          { n: 9, cats: ['Practical', 'Combat'] },
          { n: 2, cats: ['Athletics'] },
          { n: 2, cats: ['Knowledge'] },
          { n: 2, cats: ['Social'] }
        ],
        desc: 'Your life was characterized by struggle, but you found moments to rise above and it reflects in your talents.'
      },
      Secure: {
        skills: { Agility: 1, Sense: 1, Charm: 1, Presence: 1, Intellect: 1 },
        supplies: 4, wealth: 3,
        pools: CATS.map(c => ({ n: 3, cats: [c] })),
        desc: 'Your life wasn’t characterized by struggle, but you did have to work for what you got. You became excellent at many important skills.'
      },
      Comfy: {
        skills: { Artifice: 1, Precision: 1, Charm: 1, Presence: 1, Intellect: 1 },
        supplies: 2, wealth: 4,
        pools: [
          { n: 8, cats: ['Social', 'Knowledge'] },
          { n: 5, cats: ['Combat', 'Athletics'] },
          { n: 2, cats: ['Practical'] }
        ],
        desc: 'Your life never had much difficulty but it allowed you to practice the more finer aspects of existence aplenty.'
      }
    };

    // skillChoice: array of alternatives (player picks one), skills: always applied
    const MAIN_LIFEPATHS = {
      Academic: { skills: { Intellect: 1 }, pools: [{ n: 5, cats: ['Knowledge'] }, { n: 2, cats: ['Practical'] }] },
      Noble: { skills: { Presence: 1 }, pools: [{ n: 3, cats: ['Social'] }, { n: 3, cats: ['Combat'] }, { n: 1, cats: ['Knowledge'] }] },
      Merchant: { skills: { Charm: 1 }, pools: [{ n: 4, cats: ['Social'] }, { n: 3, cats: ['Practical'] }] },
      Soldier: { skills: { Might: 1, Fortitude: 1 }, pools: [{ n: 4, cats: ['Combat'] }, { n: 1, cats: ['Athletics'] }] },
      Outlander: { skills: { Sense: 1 }, pools: [{ n: 5, cats: ['Combat', 'Practical', 'Athletics'] }, { n: 2, cats: ['Knowledge'] }] },
      Diplomat: { skills: { Presence: 1, Charm: 1 }, pools: [], power: ['The Ability to Speak', 'Kingly Wit'] },
      Artisan: { skillChoice: ['Artifice', 'Precision'], pools: [{ n: 5, cats: ['Practical'] }, { n: 2, cats: ['Knowledge'] }] },
      Laborer: { skillChoice: ['Might', 'Agility'], pools: [{ n: 3, cats: ['Practical'] }, { n: 3, cats: ['Athletics'] }, { n: 1, cats: CATS }] },
      Criminal: { skills: { Agility: 1, Precision: 1 }, pools: [{ n: 3, cats: ['Practical'] }, { n: 2, cats: ['Combat', 'Athletics'] }] },
      Performer: { skills: {}, pools: [{ n: 10, cats: CATS }] },
      Medic: { skills: { Precision: 1 }, pools: [{ n: 4, cats: ['Practical'] }, { n: 3, cats: ['Knowledge'] }] },
      Navigator: { skills: { Sense: 1 }, pools: [{ n: 3, cats: ['Knowledge'] }, { n: 3, cats: ['Practical'] }, { n: 1, cats: ['Athletics'] }] },
      Investigator: { skills: { Intellect: 1 }, pools: [{ n: 3, cats: ['Knowledge'] }, { n: 3, cats: ['Social'] }, { n: 1, cats: ['Practical'] }] },
      Salvager: { skillChoice: ['Artifice', 'Fortitude'], pools: [{ n: 4, cats: ['Practical'] }, { n: 2, cats: ['Athletics'] }, { n: 1, cats: ['Knowledge'] }] },
      Organizer: { skillChoice: ['Charm', 'Resolve'], pools: [{ n: 4, cats: ['Social'] }, { n: 2, cats: ['Practical'] }, { n: 1, cats: ['Knowledge'] }] }
    };



    // ==========================================================
    // STATE
    // ==========================================================
    const blankState = () => ({
      step: 0,
      name: '', pronouns: '', concept: '',
      birth: null,
      early: null,
      earlyAlloc: [],          // [{pool, cat, talent}]
      earlyActivePool: 0,
      mains: [],               // [{key, years, skillChoice, power, alloc:[], activePool}]
      setting: '', kit: '', extraGear: '',
      powers: [], bonds: [],
      customTalents: { Knowledge: [], Combat: [], Practical: [], Athletics: [], Social: [] }
    });

    const draftKey = 'axial.generator.draft.v1';
    let S = blankState();
    try {
      const draft = JSON.parse(sessionStorage.getItem(draftKey));
      if (draft) Object.assign(S, draft);
    } catch { /* A new build also works when storage is unavailable. */ }

    function saveDraft() {
      try { sessionStorage.setItem(draftKey, JSON.stringify(S)); } catch { /* Storage is optional. */ }
    }
    document.addEventListener('input', saveDraft);
    document.addEventListener('change', saveDraft);

    const STEPS = ['Identity', 'Birth Trait', 'Early Lifepath', 'Main Lifepaths', 'Starting Gear', 'Powers & Bonds', 'Character Sheet'];

    function resetAll() {
      if (confirm('Start over? All progress will be lost.')) {
        S = blankState();
        render();
      }
    }

    // ==========================================================
    // DERIVED STATS
    // ==========================================================
    function computeSkills() {
      const sk = {}; SKILLS.forEach(s => sk[s] = 1);
      let lost = [];
      const bump = (name, src) => {
        if (sk[name] >= 5) { lost.push(`${name} +1 from ${src} (already d12)`); }
        else sk[name]++;
      };
      if (S.birth) Object.entries(BIRTH_TRAITS[S.birth].skills).forEach(([k, v]) => { for (let i = 0; i < v; i++) bump(k, S.birth + ' birth trait'); });
      if (S.early) Object.entries(EARLY_LIFEPATHS[S.early].skills).forEach(([k, v]) => { for (let i = 0; i < v; i++) bump(k, S.early + ' lifepath'); });
      S.mains.forEach(m => {
        const def = MAIN_LIFEPATHS[m.key];
        if (def.skills) Object.entries(def.skills).forEach(([k, v]) => { for (let i = 0; i < v; i++) bump(k, m.key); });
        if (def.skillChoice && m.skillChoice) bump(m.skillChoice, m.key);
      });
      return { skills: sk, lost };
    }

    function allAllocs() {
      return S.earlyAlloc.concat(...S.mains.map(m => m.alloc));
    }

    function allocatedTalents() {
      const t = {}; // "cat|name" -> level
      allAllocs().forEach(r => {
        const key = r.cat + '|' + r.talent;
        t[key] = (t[key] || 0) + 1;
      });
      return t;
    }

    function grantedNames() {
      return S.mains.map(m => m.power).filter(Boolean);
    }

    function computeTalents() {
      const result = allocatedTalents();
      const grants = AxialPowerPicker.talentGrants(S, grantedNames());
      for (const [name, level] of Object.entries(grants)) {
        result[name] = Math.max(result[name] || 0, level);
      }
      return result;
    }

    function talentLevel(cat, name) {
      return allocatedTalents()[cat + '|' + name] || 0;
    }

    function computeAge() {
      if (!S.early) return null;
      return 20 + S.mains.reduce((a, m) => a + m.years[0] + m.years[1], 0);
    }

    function computeHealth(skills) {
      return AxialCharacterRules.health(DIE_SIZE[skills.Fortitude], DIE_SIZE[skills.Resolve], computeAge() || 20);
    }

    function poolSpent(allocList, poolIdx) {
      return allocList.filter(r => r.pool === poolIdx).length;
    }

    function unspentTP() {
      let total = 0;
      if (S.early) EARLY_LIFEPATHS[S.early].pools.forEach((p, i) => total += p.n - poolSpent(S.earlyAlloc, i));
      S.mains.forEach(m => MAIN_LIFEPATHS[m.key].pools.forEach((p, i) => total += p.n - poolSpent(m.alloc, i)));
      return total;
    }

    function talentsOf(cat) {
      return TALENTS[cat].concat(S.customTalents[cat]);
    }

    const d6 = () => 1 + Math.floor(Math.random() * 6);

    // ==========================================================
    // RENDERING
    // ==========================================================
    const $main = document.getElementById('main');
    const $side = document.getElementById('sidebar');
    const $stepper = document.getElementById('stepper');

    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function render() {
      renderStepper();
      renderStep();
      renderSidebar();
    }

    function go(step) {
      S.step = Math.max(0, Math.min(STEPS.length - 1, step));
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderStepper() {
      $stepper.innerHTML = STEPS.map((name, i) => `
        <button type="button" aria-current="${i === S.step ? 'step' : 'false'}" class="step-pill ${i === S.step ? 'active' : ''} ${i < S.step ? 'done' : ''}" onclick="go(${i})">
          <span class="num">${i < S.step ? '✓' : i + 1}</span>${name}
        </button>`).join('');
    }

    // ---------- TP allocation widget (shared by early + main lifepaths) ----------
    // ownerKey: 'early' or main index
    function tpWidget(pools, allocList, activePool, ownerKey) {
      if (!pools.length) return '';
      const chips = pools.map((p, i) => {
        const left = p.n - poolSpent(allocList, i);
        return `<button type="button" aria-pressed="${i === activePool}" class="pool-chip ${i === activePool ? 'active' : ''} ${left === 0 ? 'empty' : ''}"
          onclick="setActivePool('${ownerKey}', ${i})">${p.n} TP — ${p.cats.join(' / ')} <span class="left">(${left} left)</span></button>`;
      }).join('');

      const pool = pools[activePool] || pools[0];
      const left = pool ? pool.n - poolSpent(allocList, pools.indexOf(pool)) : 0;

      const cats = pool ? pool.cats : [];
      const catBlocks = cats.map(cat => {
        const tags = talentsOf(cat).map(t => {
          const lvl = talentLevel(cat, t);
          const minusOk = allocList.some(r => r.pool === activePool && r.cat === cat && r.talent === t);
          return `<span class="talent-tag ${lvl ? 'has-level' : ''}">
            ${esc(t)}
            <span class="lvl">${lvl ? DIE_OF[lvl] : '—'}</span>
            <button aria-label="Remove one point from ${esc(t)}" data-talent="${esc(t)}" onclick="tpMinus('${ownerKey}','${cat}',this.dataset.talent)" ${minusOk ? '' : 'disabled'}>−</button>
            <button aria-label="Add one point to ${esc(t)}" data-talent="${esc(t)}" onclick="tpPlus('${ownerKey}','${cat}',this.dataset.talent)" ${left > 0 && lvl < 5 ? '' : 'disabled'}>+</button>
          </span>`;
        }).join('');
        return `<div class="talent-cat"><div class="talent-cat-name">${cat}</div><div class="talent-grid">${tags}</div></div>`;
      }).join('');

      return `
        <h3>Spend Talent Points</h3>
        <p class="rules-note">1 TP buys a new Talent at <b>1d4</b> or raises an existing Talent one level (max d12). Select a pool, then click <b>+</b> on talents in its allowed categories. You can also invent a new Talent with your GM's blessing below.</p>
        <div class="pool-chips">${chips}</div>
        ${catBlocks}
        <div class="custom-talent-row no-print">
          <input type="text" aria-label="Custom talent name" id="ct-name-${ownerKey}" placeholder="Custom talent name (GM approved)" />
          <select aria-label="Custom talent category" id="ct-cat-${ownerKey}">${cats.map(c => `<option>${c}</option>`).join('')}</select>
          <button class="btn small" onclick="addCustomTalent('${ownerKey}')">Add Talent</button>
        </div>`;
    }

    function getOwner(ownerKey) {
      if (ownerKey === 'early') {
        return { pools: EARLY_LIFEPATHS[S.early].pools, alloc: S.earlyAlloc, get activePool() { return S.earlyActivePool; }, set activePool(v) { S.earlyActivePool = v; } };
      }
      const m = S.mains[Number(ownerKey)];
      return { pools: MAIN_LIFEPATHS[m.key].pools, alloc: m.alloc, get activePool() { return m.activePool; }, set activePool(v) { m.activePool = v; } };
    }

    function setActivePool(ownerKey, i) { getOwner(ownerKey).activePool = i; render(); }

    function tpPlus(ownerKey, cat, talent) {
      const o = getOwner(ownerKey);
      const i = o.activePool;
      const pool = o.pools[i];
      if (!pool || !pool.cats.includes(cat)) return;
      if (pool.n - poolSpent(o.alloc, i) <= 0) return;
      if (talentLevel(cat, talent) >= 5) return;
      o.alloc.push({ pool: i, cat, talent });
      render();
    }

    function tpMinus(ownerKey, cat, talent) {
      const o = getOwner(ownerKey);
      for (let i = o.alloc.length - 1; i >= 0; i--) {
        if (o.alloc[i].pool === o.activePool && o.alloc[i].cat === cat && o.alloc[i].talent === talent) { o.alloc.splice(i, 1); break; }
      }
      render();
    }

    function addCustomTalent(ownerKey) {
      const name = document.getElementById('ct-name-' + ownerKey).value.trim();
      const cat = document.getElementById('ct-cat-' + ownerKey).value;
      if (!name) return;
      const exists = talentsOf(cat).some(t => t.toLowerCase() === name.toLowerCase());
      if (!exists) S.customTalents[cat].push(name);
      render();
    }

    // ---------- Steps ----------
    function renderStep() {
      switch (S.step) {
        case 0: return renderIdentity();
        case 1: return renderBirth();
        case 2: return renderEarly();
        case 3: return renderMains();
        case 4: return renderGear();
        case 5: return renderPowersAndBonds();
        case 6: return renderSummary();
      }
    }

    function navButtons(backOk, nextOk, nextLabel) {
      return `<div class="step-actions">
        <button class="btn" ${backOk ? '' : 'disabled'} onclick="go(S.step-1)">← Back</button>
        <button class="btn glow" ${nextOk ? '' : 'disabled'} onclick="go(S.step+1)">${nextLabel || 'Next →'}</button>
      </div>`;
    }

    function renderIdentity() {
      $main.innerHTML = `
        <div class="card">
          <h2>Who Are You?</h2>
          <p class="rules-note">Every Axial character begins the same way: all ten Skills at <b>level 1 (1d4)</b>, then a <b>birth trait</b>, an <b>early lifepath</b>, and any number of <b>main lifepaths</b> — each adding 2d6 years to your age. This generator walks you through each step and tracks your sheet as you go.</p>
          <label class="field" for="f-name">Character Name</label>
          <input type="text" id="f-name" value="${esc(S.name)}" placeholder="e.g. Vex Calloway" />
          <label class="field" for="f-pronouns">Pronouns</label>
          <input type="text" id="f-pronouns" value="${esc(S.pronouns)}" placeholder="e.g. they/them" />
          <label class="field" for="f-concept">Concept / Notes</label>
          <textarea id="f-concept" placeholder="A disgraced stellar cartographer with a debt to the wrong people...">${esc(S.concept)}</textarea>
          ${navButtons(false, true)}
        </div>`;
      document.getElementById('f-name').oninput = e => { S.name = e.target.value; renderSidebar(); };
      document.getElementById('f-pronouns').oninput = e => { S.pronouns = e.target.value; };
      document.getElementById('f-concept').oninput = e => { S.concept = e.target.value; };
    }

    function renderBirth() {
      const opts = Object.entries(BIRTH_TRAITS).map(([k, v]) => `
        <button type="button" aria-pressed="${S.birth === k}" class="opt ${S.birth === k ? 'selected' : ''}" onclick="S.birth='${k}';render()">
          <span class="opt-name">${k}</span>
          <span class="opt-stats">${Object.entries(v.skills).map(([s, n]) => `${s} +${n}`).join(', ')}</span>
          <span class="opt-desc">${v.desc}</span>
        </button>`).join('');
      $main.innerHTML = `
        <div class="card">
          <h2>Birth Trait</h2>
          <p class="rules-note">Choose one. Your birth trait raises two Skills by one level each.</p>
          <div class="option-grid">${opts}</div>
          ${navButtons(true, !!S.birth)}
        </div>`;
    }

    function renderEarly() {
      const opts = Object.entries(EARLY_LIFEPATHS).map(([k, v]) => `
        <button type="button" aria-pressed="${S.early === k}" class="opt ${S.early === k ? 'selected' : ''}" onclick="pickEarly('${k}')">
          <span class="opt-name">${k}</span>
          <span class="opt-stats">
            ${Object.entries(v.skills).map(([s, n]) => `${s} +${n}`).join(', ')}<br/>
            Supplies +${v.supplies}, Wealth +${v.wealth}<br/>
            ${v.pools.map(p => `${p.n}TP ${p.cats.join('/')}`).join(' · ')}
          </span>
          <span class="opt-desc">${v.desc}</span>
        </button>`).join('');

      $main.innerHTML = `
        <div class="card">
          <h2>Early Lifepath</h2>
          <p class="rules-note">Choose one. Your early lifepath covers your first twenty years — it raises five Skills, sets your starting <b>Supplies</b> and <b>Wealth</b>, and grants <b>Talent Points</b> by category. After this step your age is set to <b>20</b>.</p>
          <div class="option-grid">${opts}</div>
          ${S.early ? tpWidget(EARLY_LIFEPATHS[S.early].pools, S.earlyAlloc, S.earlyActivePool, 'early') : ''}
          ${navButtons(true, !!S.early)}
        </div>`;
    }

    function pickEarly(k) {
      if (S.early !== k) { S.early = k; S.earlyAlloc = []; S.earlyActivePool = 0; }
      render();
    }

    function renderMains() {
      const instances = S.mains.map((m, idx) => {
        const def = MAIN_LIFEPATHS[m.key];
        let extras = '';
        if (def.skillChoice) {
          extras += `<div class="choice-row">${def.skillChoice.map(s =>
            `<button type="button" class="choice-pill ${m.skillChoice === s ? 'selected' : ''}" onclick="S.mains[${idx}].skillChoice='${s}';render()">${s} +1</button>`).join('')}</div>`;
        }
        if (def.power) {
          extras += `<div class="choice-row">${def.power.map(p =>
            `<button type="button" class="choice-pill ${m.power === p ? 'selected' : ''}" onclick="S.mains[${idx}].power='${esc(p)}';render()">${p}</button>`).join('')}</div>`;
          if (m.power) extras += `<div class="power-desc"><b>${esc(m.power)}:</b> ${esc(AxialPowerPicker.find(m.power)?.description || '')}</div>`;
        }
        return `<div class="lp-instance">
          <div class="lp-head">
            <h4>${idx + 1}. ${m.key}</h4>
            <span class="lp-roll">2d6 → <span class="dice">${m.years[0]} + ${m.years[1]} = +${m.years[0] + m.years[1]} years</span></span>
            <button class="btn small danger" onclick="removeMain(${idx})">Remove</button>
          </div>
          ${describeMain(m.key)}
          ${extras}
          ${tpWidget(def.pools, m.alloc, m.activePool, String(idx))}
        </div>`;
      }).join('');

      const addOpts = Object.keys(MAIN_LIFEPATHS).map(k =>
        `<button type="button" class="opt" onclick="addMain('${k}')">
          <span class="opt-name">+ ${k}</span>
          <span class="opt-stats">${mainStatsLine(k)}</span>
        </button>`).join('');

      const mainsOk = S.mains.every(m => {
        const def = MAIN_LIFEPATHS[m.key];
        if (def.skillChoice && !m.skillChoice) return false;
        if (def.power && !m.power) return false;
        return true;
      });

      $main.innerHTML = `
        <div class="card">
          <h2>Main Lifepaths</h2>
          <p class="rules-note">Take <b>any number</b> of main lifepaths — including the same one more than once. Each adds <b>2d6 years</b> (auto-rolled) to your age. Starting Health is <b>10 + the maximum face of each of your Fortitude and Resolve dice</b>. Subtract 2 for every full five years over age 35.</p>
          ${instances || '<p class="rules-note"><em>No main lifepaths yet — your character is a fresh-faced 20-year-old. Add one below, or continue if that’s the plan.</em></p>'}
          <h3>Add a Lifepath</h3>
          <div class="option-grid">${addOpts}</div>
          ${navButtons(true, mainsOk)}
        </div>`;
    }

    function mainStatsLine(k) {
      const def = MAIN_LIFEPATHS[k];
      const bits = [];
      if (def.skills && Object.keys(def.skills).length) bits.push(Object.entries(def.skills).map(([s, n]) => `${s} +${n}`).join(', '));
      if (def.skillChoice) bits.push(def.skillChoice.join(' or ') + ' +1');
      if (def.pools.length) bits.push(def.pools.map(p => `${p.n}TP ${p.cats.length === 5 ? 'any' : p.cats.join('/')}`).join(' · '));
      if (def.power) bits.push('Gain a power');
      return bits.join('<br/>');
    }

    function describeMain(k) {
      return `<p class="rules-note" style="margin-bottom:6px">${mainStatsLine(k)}</p>`;
    }

    function addMain(key) {
      S.mains.push({ key, years: [d6(), d6()], skillChoice: null, power: null, alloc: [], activePool: 0 });
      render();
    }

    function removeMain(idx) {
      S.mains.splice(idx, 1);
      render();
    }

    function gearItems() {
      const kit = AxialCharacterRules.kits[S.setting]?.[S.kit] || [];
      const extras = S.extraGear.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      return kit.concat(extras);
    }

    function gearList(items) {
      if (!items.length) return '';
      return `<ul class="gear-list">${items.map(item => {
        const i = item.indexOf('|');
        const name = i < 0 ? item : item.slice(0, i).trim();
        return `<li><strong>${esc(name)}</strong>${i < 0 ? '' : `<small>${esc(item.slice(i + 1).trim())}</small>`}</li>`;
      }).join('')}</ul>`;
    }

    function renderGear() {
      const kits = AxialCharacterRules.kits;
      const choices = Object.keys(kits[S.setting] || {});
      $main.innerHTML = `<div class="card">
        <h2>Starting Gear</h2>
        <p class="rules-note">Choose a package from your setting, or enter the equipment you agreed on with your GM. Each item goes on your sheet with its full struct.</p>
        <div class="kit-fields">
          <div><label class="field" for="gear-setting">Setting</label>
          <select id="gear-setting"><option value="">Choose a setting</option>
          ${Object.keys(kits).concat('GM-defined gear').map(s => `<option${S.setting === s ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select></div>
          ${choices.length ? `<div><label class="field" for="gear-kit">Starting package</label>
          <select id="gear-kit"><option value="">Choose a package</option>${choices.map(k => `<option${S.kit === k ? ' selected' : ''}>${esc(k)}</option>`).join('')}</select></div>` : ''}
        </div>
        ${gearList(kits[S.setting]?.[S.kit] || [])}
        <label class="field" for="extra-gear">${choices.length ? 'Additional equipment' : 'Equipment'}</label>
        <p id="gear-help" class="rules-note">Enter one item per line. Include its mass to count it toward encumbrance.</p>
        <textarea id="extra-gear" aria-describedby="gear-help" placeholder="Field journal | 1 Mass">${esc(S.extraGear)}</textarea>
        ${navButtons(true, true)}
      </div>`;
      document.getElementById('gear-setting').onchange = e => { S.setting = e.target.value; S.kit = ''; render(); };
      if (choices.length) document.getElementById('gear-kit').onchange = e => { S.kit = e.target.value; render(); };
      document.getElementById('extra-gear').oninput = e => { S.extraGear = e.target.value; renderSidebar(); };
    }

    function renderPowersAndBonds() {
      $main.innerHTML = `<section class="card"><h2>Powers</h2><div id="power-picker"></div></section>
        <section class="card"><h2>Bonds</h2><div id="bond-picker"></div></section>${navButtons(true, true, 'Review sheet')}`;
      AxialPowerPicker.mount(document.getElementById('power-picker'), {
        state: S, skills: computeSkills().skills, talents: allocatedTalents(),
        granted: grantedNames(), gear: gearItems(), kit: S.kit,
        talentCatalog: Object.fromEntries(CATS.map(cat => [cat, talentsOf(cat)])), onChange: renderSidebar
      });
      AxialPowerPicker.mountBonds(document.getElementById('bond-picker'), S, renderSidebar);
    }

    function getCharacterSheet() {
      const {skills} = computeSkills();
      const age = computeAge();
      const hp = computeHealth(skills);
      const gear = gearItems();
      const powers = AxialPowerPicker.selected(S, grantedNames());
      const supplies = EARLY_LIFEPATHS[S.early]?.supplies || 0;
      const wealth = EARLY_LIFEPATHS[S.early]?.wealth || 0;
      const maxMass = 5 * (DIE_SIZE[skills.Fortitude] + DIE_SIZE[skills.Might] + DIE_SIZE[skills.Resolve]);
      const masses = gear.map(g => g.match(/\b(\d+(?:\.\d+)?)\s+mass\s*$/i));
      const knownMass = masses.reduce((sum, m) => sum + (m ? Number(m[1]) : 0), supplies);
      const surgeCap = powers.some(p => p.name === 'Surging Support') ? 10 : 5;
      const vitals = {
        Health: `${hp.health} / ${hp.health}`, Strain: '0 / 10', Surges: `0 / ${surgeCap}`,
        Supplies: supplies, Wealth: wealth, XP: 0, Wounds: 0, Scars: 0,
        Encumbrance: `${knownMass} / ${maxMass}`
      };
      const unspent = unspentTP();
      if (unspent) vitals['Unspent TP'] = unspent;
      const notes = [];
      if (masses.some(m => !m)) notes.push('Encumbrance includes only equipment with a listed mass. Add the remaining item mass during play.');
      const remaining = [];
      const poolNotes = (name, pools, alloc) => pools.forEach((pool, i) => {
        const count = pool.n - poolSpent(alloc, i);
        if (count) remaining.push(`${name}: ${count} ${pool.cats.join('/')} TP`);
      });
      if (S.early) poolNotes(S.early, EARLY_LIFEPATHS[S.early].pools, S.earlyAlloc);
      S.mains.forEach((m,i) => poolNotes(`${m.key} ${i + 1}`, MAIN_LIFEPATHS[m.key].pools, m.alloc));
      if (remaining.length) notes.push('Unspent talent pools — ' + remaining.join('; '));
      if (hp.health === 0) notes.push('Maximum Health has reached zero. This character dies under §5.3.');
      const talents = Object.entries(computeTalents()).map(([key, level]) => {
        const i = key.indexOf('|');
        return { category: key.slice(0, i), name: key.slice(i + 1), die: DIE_OF[level] };
      });
      return {
        name: S.name, pronouns: S.pronouns, concept: S.concept, age, birth: S.birth || '', early: S.early || '',
        mains: S.mains.map(m => ({ key: m.key, years: m.years[0] + m.years[1], skillChoice: m.skillChoice, power: m.power })),
        skills: Object.fromEntries(SKILLS.map(k => [k, DIE_OF[skills[k]]])), talents, vitals,
        kit: S.kit ? `${S.setting} / ${S.kit}` : S.setting === 'GM-defined gear' ? S.setting : '', gear, powers,
        bonds: S.bonds.filter(b => b.text.trim()).map(b => ({...b})), notes: notes.join('\n')
      };
    }

    function openDigitalSheet() {
      try {
        sessionStorage.setItem('axial.generator.sheet.v1', JSON.stringify(getCharacterSheet()));
        location.assign('axialcharactersheet.html?from=generator');
      } catch {
        document.getElementById('export-status').textContent = 'The digital sheet needs session storage. Enable it or use the Word or PDF export.';
      }
    }

    function renderSummary() {
      const sheet = getCharacterSheet();
      const formatRows = entries => entries.map(([label,value]) => `<div class="sum-line"><span>${esc(label)}</span><b class="v">${esc(value)}</b></div>`).join('');
      const missing = [];
      if (!S.birth) missing.push('a birth trait');
      if (!S.early) missing.push('an early lifepath');
      if (S.mains.some(m => (MAIN_LIFEPATHS[m.key].skillChoice && !m.skillChoice) || (MAIN_LIFEPATHS[m.key].power && !m.power))) missing.push('a lifepath choice');
      if (!sheet.gear.length) missing.push('starting gear');
      if (!sheet.bonds.length) missing.push('party and backstory bonds');
      const lifepaths = [S.birth, S.early, ...sheet.mains.map(m => `${m.key} (+${m.years} years${m.skillChoice ? `, ${m.skillChoice} +1` : ''})`)].filter(Boolean).join(' → ');
      const {lost} = computeSkills();
      $main.innerHTML = `<section class="card summary-sheet">
        <h2>${esc(sheet.name) || 'Unnamed Character'}</h2>
        <p class="rules-note">${[sheet.pronouns, sheet.age ? `Age ${sheet.age}` : ''].filter(Boolean).map(esc).join(' · ')}</p>
        ${sheet.concept ? `<p class="sum-text multiline">${esc(sheet.concept)}</p>` : ''}
        <p class="sum-text">${esc(lifepaths)}</p>
        ${missing.length ? `<p class="warn">Still to fill in: ${missing.join(', ')}.</p>` : ''}
        ${lost.length ? `<p class="warn">At the d12 skill cap: ${esc(lost.join('; '))}.</p>` : ''}
        <div class="export-actions no-print">
          <button id="word-export" class="btn glow">Download Word</button>
          <button id="pdf-export" class="btn">Print / Save PDF</button>
          <button class="btn" onclick="openDigitalSheet()">Open digital sheet</button>
        </div>
        <p class="rules-note no-print" id="export-status" role="status">The Word file can also be opened in Google Docs.</p>
        <div class="summary-grid"><div><h3>Vitals</h3>${formatRows(Object.entries(sheet.vitals))}</div>
        <div><h3>Skills</h3>${formatRows(Object.entries(sheet.skills))}</div></div>
        <h3>Talents</h3>${sheet.talents.length ? formatRows(sheet.talents.map(t => [`${t.name} · ${t.category}`,t.die])) : '<p class="sum-text">None recorded.</p>'}
        <h3>Powers</h3>${sheet.powers.length ? sheet.powers.map(p => `<div class="sum-block"><b>${esc(p.name)}</b>
          <span class="rules-note">${[p.type,p.cooldown,p.speed].filter(Boolean).map(esc).join(' · ')}</span>
          <p class="sum-text multiline">${esc(p.description)}</p>${p.choice ? `<p class="sum-text">${esc(p.choice)}</p>` : ''}</div>`).join('') : '<p class="sum-text">None recorded.</p>'}
        <h3>Bonds</h3>${sheet.bonds.length ? sheet.bonds.map(b => `<p class="sum-text"><b>${esc(b.type)}</b> · ${esc(b.text)}</p>`).join('') : '<p class="sum-text">None recorded.</p>'}
        <h3>Gear${sheet.kit ? ` · ${esc(sheet.kit)}` : ''}</h3>${gearList(sheet.gear) || '<p class="sum-text">None recorded.</p>'}
        ${sheet.notes ? `<h3>Notes</h3><p class="sum-text multiline">${esc(sheet.notes)}</p>` : ''}
        <div class="step-actions no-print"><button class="btn" onclick="go(S.step-1)">Back to powers &amp; bonds</button></div>
      </section>`;
      document.getElementById('word-export').onclick = () => AxialCharacterExport.word(getCharacterSheet());
      document.getElementById('pdf-export').onclick = () => AxialCharacterExport.print(getCharacterSheet());
    }

    // ---------- Sidebar ----------
    function renderSidebar() {
      saveDraft();
      const { skills } = computeSkills();
      const talents = computeTalents();
      const age = computeAge();
      const hp = computeHealth(skills);
      const unspent = unspentTP();

      const bars = SKILLS.map(s => `
        <div class="skill-row">
          <span>${s}</span>
          <div class="skill-meter"><span style="width:${skills[s] * 20}%"></span></div>
          <span class="die">${DIE_OF[skills[s]]}</span>
        </div>`).join('');

      const tList = CATS.map(cat => {
        const items = Object.entries(talents)
          .filter(([k]) => k.startsWith(cat + '|'))
          .map(([k, lvl]) => `${esc(k.slice(k.indexOf('|') + 1))} <b>${DIE_OF[lvl]}</b>`);
        return items.length ? `<div><b>${cat}:</b> ${items.join(', ')}</div>` : '';
      }).join('');

      $side.innerHTML = `
        <div class="card">
          <h3>${esc(S.name) || 'New Character'}</h3>
          <div class="stat-line"><span>Age</span><span class="v">${age === null ? '—' : age}</span></div>
          <div class="stat-line"><span>Health</span><span class="v">${hp.health}${hp.agePenalty ? ` <span class="neg">(−${hp.agePenalty} age)</span>` : ''}</span></div>
          <div class="stat-line"><span>Supplies</span><span class="v">${S.early ? EARLY_LIFEPATHS[S.early].supplies : '—'}</span></div>
          <div class="stat-line"><span>Wealth</span><span class="v">${S.early ? EARLY_LIFEPATHS[S.early].wealth : '—'}</span></div>
          <div class="stat-line"><span>Unspent TP</span><span class="v ${unspent ? 'neg' : ''}">${unspent}</span></div>
          <div class="skill-bars">${bars}</div>
          ${tList ? `<h3 style="margin-top:14px">Talents</h3><div class="side-talents">${tList}</div>` : ''}
        </div>`;
    }

    render();
  </script>
</body>

</html>
