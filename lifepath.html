  <style>
    /* Inline additional styling for layout and talent UI */
    #main-container {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
    }

    #game-content {
      flex: 2;
      margin-right: 20px;
    }

    #summary-pane {
      flex: 1;
      background: #262626;
      border: 1px solid #444;
      padding: 50px;
      border-radius: 4px;
      max-height: calc(100vh - 60px);
      overflow-y: auto;
      margin-top: 10px;
    }

    .talent-row {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }

    .talent-name {
      flex: 1;
    }

    .talent-controls button {
      margin: 0 5px;
    }

    .lifepath-btn,
    .event-btn {
      background-color: #444;
      color: #ccc;
      border: 1px solid #555;
      padding: 8px 14px;
      font-size: 1em;
      cursor: pointer;
      border-radius: 4px;
      margin: 5px;
    }

    .lifepath-btn:hover,
    .event-btn:hover {
      background-color: #555;
    }

    .disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .centered-death-screen {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #262626;
      border: 1px solid #444;
      padding: 20px;
      border-radius: 4px;
      text-align: center;
      z-index: 2000;
    }

    /* Monospaced font for Bonds and Items */
    .bond-card,
    .item-card {
      font-family: "Consolas", "Courier New", monospace;
    }

    /* New card container for grouping UI sections */
    .card-container {
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 45px;
      margin-bottom: 15px;
    }
  </style>
<style>html { scroll-behavior: auto }</style>
