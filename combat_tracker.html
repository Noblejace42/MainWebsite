  <title>Astral Axial Combat Tracker</title>
  <link rel="stylesheet" href="../../css/styles.css" />
  <style>
    /* Container for the entire UI */
    #tracker-controls {
      margin-bottom: 10px;
    }

    #tracker-controls button {
      margin-right: 10px;
    }

    /* Outer scrollable area – starts 800x600, can expand in all directions */
    #combat-tracker {
      position: relative;
      width: 800px;
      height: 600px;
      background: #1a1a1a;
      border: 1px solid #444;
      overflow: auto;
      /* Scrollbars appear if we expand beyond these dimensions */
    }

    /* The "canvas" that holds zones, tokens, and the SVG overlay
       We'll expand/shift this canvas as needed. */
    #tracker-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 800px;
      /* Matches initial outer size */
      height: 600px;
    }

    /* Larger default zone size, teal border */
    .zone {
      position: absolute;
      width: 200px;
      height: 120px;
      background: rgba(0, 128, 128, 0.2);
      border: 2px solid teal;
      color: #ccc;
      text-align: center;
      line-height: 120px;
      /* Vertically centers text */
      cursor: move;
      user-select: none;
      box-sizing: border-box;
    }

    /* Token is rectangular with a label inside */
    .token {
      position: absolute;
      width: 60px;
      height: 40px;
      background: #888;
      border: 2px solid #ccc;
      box-sizing: border-box;
      cursor: move;
      user-select: none;
    }

    .token-label {
      display: block;
      text-align: center;
      line-height: 40px;
      pointer-events: none;
      color: #000;
    }

    /* Small red delete button for both zones & tokens */
    .delete-btn {
      position: absolute;
      top: 0;
      right: 0;
      background: #c00;
      color: #fff;
      font-size: 8px;
      border: none;
      cursor: pointer;
      padding: 1px 3px;
      z-index: 20;
    }

    /* Minimal border style for tokens (no color cycling) */
    .cover-none {
      border-color: #ccc;
    }

    /* SVG overlay for arrows */
    #connection-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      /* Let clicks pass through to zones/tokens */
    }

    /* Resizer handle for both zones & tokens */
    .resizer {
      position: absolute;
      width: 14px;
      height: 14px;
      bottom: 0;
      right: 0;
      background: #444;
      border: 1px solid #888;
      cursor: se-resize;
      z-index: 10;
    }
  </style>
<style>html { scroll-behavior: auto }</style>
</head>

<body>
  <div id="navContainer"></div>


  <div class="container">
    <h2>Astral Axial Combat Tracker</h2>
    <div id="tracker-controls">
      <button id="add-zone-btn">Add Zone</button>
      <button id="add-token-btn">Add Token</button>
      <button id="link-zones-btn">Link Zones</button>
      <button id="clear-links-btn">Clear Links</button>
      <span id="link-mode-indicator" style="color: yellow; margin-left: 10px;"></span>
    </div>

    <div id="combat-tracker">
      <div id="tracker-canvas">
        <!-- SVG overlay for arrows goes here -->
        <svg id="connection-overlay">
          <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
              <polygon points="0 0, 10 3.5, 0 7" fill="teal" />
            </marker>
          </defs>
        </svg>
      </div>
    </div>
  </div>


</body>

</html>
