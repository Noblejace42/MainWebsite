<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Generated from projects/enron.html by tools/sync-bookmarks.py. -->
  <script>location.replace(new URL("projects/enron.html" + location.search + location.hash, location.href));</script>
  <base href="projects/enron.html">
  <link rel="canonical" href="enron.html">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <meta charset="utf-8">
  <title>Enron En‑telligence</title>
  <style>
    :root {
      --blue: #0060a9;
      --red: #d42b2b;
      --green: #2a9c55;
      --black: #000;
      --white: #fff;
      --gray: #c0c0c0
    }

    body {
      margin: 0;
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      color: var(--white);
      background: repeating-linear-gradient(45deg, var(--green)0 20px, var(--blue)20px 40px, var(--red)40px 60px);
      background-size: 600% 600%;
      animation: bgscroll 90s linear infinite
    }

    @keyframes bgscroll {
      0% {
        background-position: 0 0
      }

      100% {
        background-position: 600% 600%
      }
    }

    #wrapper {
      max-width: 600px;
      margin: 60px auto;
      padding: 20px 30px 40px;
      background: var(--black);
      border: 3px dotted var(--gray);
      box-shadow: 0 0 20px var(--red), 0 0 40px var(--blue);
      text-align: center
    }

    #logo {
      width: 120px
    }

    h1 {
      margin: 10px 0 30px;
      font-size: 36px;
      letter-spacing: 2px;
      text-shadow: 0 0 8px var(--blue), 0 0 14px var(--green);
      background: linear-gradient(90deg, var(--blue), var(--green), var(--red));
      -webkit-background-clip: text;
      color: transparent
    }

    form {
      display: flex;
      gap: 10px;
      margin-bottom: 25px
    }

    input {
      flex: 1;
      padding: 10px;
      border: 3px inset var(--gray);
      font-size: 16px
    }

    button {
      padding: 10px 18px;
      border: 3px outset var(--gray);
      font-size: 16px;
      background: var(--blue);
      color: var(--white);
      cursor: pointer
    }

    button:hover {
      background: var(--green)
    }

    #answer {
      white-space: pre-wrap;
      text-align: left;
      padding: 15px;
      background: var(--black);
      border: 2px solid var(--gray);
      height: 260px;
      overflow: auto;
      font-family: Courier New, monospace;
      box-shadow: inset 0 0 10px var(--red)
    }

    @keyframes blink {
      50% {
        opacity: 0
      }
    }

    .loading::after {
      content: '▌';
      animation: blink 1s steps(1) infinite
    }
  </style>
<style>html { scroll-behavior: auto }</style>
</head>

<body>
  <div id="wrapper">
    <img src="../assets/images/enron.png" id="logo" alt="Enron logo">
    <h1>EN‑TELLIGENCE</h1>
    <form id="chatForm">
      <input id="query" placeholder="Ask Enron a question…" autocomplete="off">
      <button type="submit">ASK</button>
    </form>
    <pre id="answer"></pre>
  </div>

</body>

</html>
